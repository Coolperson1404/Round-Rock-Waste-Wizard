            : 'Detected corrugated kraft cardboard with a taped seam, consistent with a shipping box.',
          tip: 'Flatten it first so it fits in the blue recycling cart with the lid closed. Remove plastic air pillows (air pillows go in trash).',
          badge: hasPrime ? `Amazon Prime Match (${Math.round(conf * 100)}%)` : `On-Device AI Match (${Math.round(conf * 100)}%)`,
          badgeIcon: 'recycle',
          confidence: conf
        };
      }

      // Filter out pure background classes if specific objects are detected
      const nonBackgroundPreds = predictions.filter(p => {
        const c = p.className.toLowerCase();
        for (const bg of BACKGROUND_CLASSES) {
          if (c.includes(bg)) return false;
        }
        return true;
      });

      // Deliberately NOT falling back to the raw predictions: if every class was
      // scenery there is nothing to match, and matching anyway turned "desk"
      // into "Computer, laptop, tablet".
      const candidateList = nonBackgroundPreds;
      const allBackground = predictions.length > 0 && nonBackgroundPreds.length === 0;

      // Anything below this is model noise. Matching on a 1.7% guess produced
      // confident-looking answers built on nothing.
      const MIN_PREDICTION_PROB = 0.10;
      const confidentPreds = candidateList.filter(p => p.probability >= MIN_PREDICTION_PROB);

      // ImageNet class names are comma-separated synonym lists, and so are the
      // dictionary keys. Compare synonym to synonym rather than by raw
      // substring, which matched the key "chest" against the class
      // "medicine chest, medicine cabinet" and called a cabinet a cardboard box.
      const synonymsOf = str => str.toLowerCase().split(',').map(t => t.trim()).filter(Boolean);
      const classMatchesKey = (klow, cls) => {
        const keyTerms = synonymsOf(klow), clsTerms = synonymsOf(cls);
        return keyTerms.some(kt => clsTerms.some(ct => {
          if (ct === kt) return true;
          // Short words are too ambiguous to accept as part of a longer name.
          if (kt.length <= 6) return false;
          return new RegExp('\\b' + kt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(ct);
        }));
      };

      // 1. Direct match in expanded dictionary keys with material signature weighting
      for (const pred of confidentPreds) {
        const cls = pred.className.toLowerCase();
        let conf = pred.probability;

        for (const key in IMAGENET_TO_ROUND_ROCK) {
          const klow = key.toLowerCase();
          if (classMatchesKey(klow, cls)) {
            const m = IMAGENET_TO_ROUND_ROCK[key];
            let boost = pred.scale && pred.scale < 1.0 ? 1.12 : 1.0;

            // Apply material signature heuristics
            if (materialSigs) {
              if ((m.match.includes('Cardboard') || m.match.includes('Paper')) && materialSigs.kraftBrownRatio > 0.15) {
                boost *= 1.18;
              }
              if (m.match.includes('Aluminum') || m.match.includes('can') || m.match.includes('tin')) {
                if (materialSigs.metallicRatio > 0.18) boost *= 1.20;
              }
              if (m.match.includes('Glass') && materialSigs.glassRefractRatio > 0.12) {
                boost *= 1.15;
              }
              if (m.match.includes('Milk jug') && materialSigs.hdpeWhiteRatio > 0.20) {
                boost *= 1.15;
              }
              if (m.match.includes('Styrofoam') && materialSigs.foamWhiteRatio > 0.25) {
                boost *= 1.22;
              }
            }

            // No artificial floor: a 12% prediction must not be shown as 72%.
            const finalConf = Math.min(0.99, Math.round(conf * boost * 100) / 100);
            const isRecycle = m.cat === 'recycle';

            return {
              item: m.name,
              match: m.match,
              cat: m.cat,
              why: isRecycle 
                ? `Neural vision network identified recyclable ${m.name} (${Math.round(finalConf * 100)}% match).`
                : `Neural vision classifier detected ${m.name} (${Math.round(finalConf * 100)}% match).`,
              tip: m.tip,
              badge: `On-Device AI Match (${Math.round(finalConf * 100)}%)`,
              badgeIcon: isRecycle ? 'recycle' : 'bolt',
              confidence: finalConf
            };
          }
        }

        // 2. Keyword fallback match against Round Rock ITEMS database
        const item = search(cls)[0];
        if (item) {
          const isRecycle = item.cat === 'recycle';
          return {
            item: item.n,
            match: item.n,
            cat: item.cat,
            why: `On-device vision classifier detected shape and material: ${cls}.`,
            tip: item.note || 'Follow City of Round Rock sorting guidelines.',
            badge: `On-Device AI Match (${Math.round(conf * 100)}%)`,
            badgeIcon: isRecycle ? 'recycle' : 'bolt',
            confidence: conf
          };
        }
      }

      // Corrugated / Amazon fallback. Reached only once the model has failed to
      // name a specific object, and only with corroboration: the model saw a
      // box, every prediction was background scenery, or there was no model at
      // all (the offline heuristic path).
      if ((modelSawBox || predictions.length === 0 || allBackground) &&
          (hasPrime || hasAmazonPattern)) {
        return cardboardResult();
      }

      // Every prediction was scenery (a desk, a table, a worktop) and there was
      // no cardboard evidence, so nothing in the photo was actually identified.
      // Say so instead of keyword-matching "desk" into an unrelated item.
      if (allBackground) return null;

      // 3. Fallback to top predicted class name
      const top = confidentPreds[0];
      // With no model there are no predictions; let the caller show the
      // manual picker rather than throwing.
      if (!top || !top.className) return null;
      // No ITEMS[0] default here: an unrecognised class must fall through to the
      // manual picker rather than return an arbitrary item as if it were a match.
      const topItem = search(top.className)[0];
      if (!topItem) return null;
      return {
        item: top.className.split(',')[0],
        match: topItem.n,
        cat: topItem.cat,
        why: `Visual classification detected: ${top.className}.`,
        tip: topItem.note || 'Check item description and rules below.',
        badge: `On-Device AI Match (${Math.round(top.probability * 100)}%)`,
        badgeIcon: 'bolt',
        confidence: top.probability
      };
    }

    /* ---------- Tier 3: Cloud AI (Gemini Flash & Claude Vision) ---------- */
    async function callGeminiVision(key, base64Data) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(key)}`;
      const prompt = rulesPrompt() +
        '\nLook at the photo. Identify the single main object a person is trying to throw away.\n' +
        'Reply with ONLY valid JSON (no markdown fences, no other text):\n' +
        '{"item":"short plain name of the object","match":"exact item name from the list above, or empty string if none fits","category":"recycle|trash|center|hhw|brush|bulk|other","why":"one short sentence describing what you see","tip":"one short sentence: what the person should do to prepare it","confidence":0.95}';

      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
            ]
          }],
          generationConfig: { temperature: 0.1, maxOutputTokens: 400 }
        })
      });

      if (!r.ok) {
        if (r.status === 400 || r.status === 403) throw new Error('KEY');
        if (r.status === 429) throw new Error('BUSY');
        throw new Error('CLOUD_API_ERROR');
      }
      const data = await r.json();
      const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const m = txt.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('PARSE');
      return JSON.parse(m[0]);
    }

    /* Shape the cloud answer must come back in. Enforced server-side rather
       than requested in prose. */
    const CLOUD_ANSWER_SCHEMA = {
      type: 'object',
      properties: {
        item: { type: 'string', description: 'short plain name of the object' },
        match: { type: 'string', description: 'exact item name from the list, or empty string' },
        category: { type: 'string', enum: ['recycle', 'trash', 'center', 'hhw', 'brush', 'bulk', 'other'] },
        why: { type: 'string', description: 'one short sentence describing what you see' },
        tip: { type: 'string', description: 'one short sentence on how to prepare it' },
        confidence: { type: 'number', minimum: 0, maximum: 1 }
      },
      required: ['item', 'match', 'category', 'why', 'tip', 'confidence'],
      additionalProperties: false
    };

    async function callClaudeVision(key, base64Data) {
      const model = await pickModel(key);
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json', 'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'server-side-fallback-2026-07-01',
          // Required for calls made straight from a web view rather than a server.
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model,
          // Thinking is on by default and its tokens count here, so 400 (the old
          // value) could truncate mid-answer.
          max_tokens: 2000,
          // A quick photo classification does not need deep reasoning. Lowering
          // effort is the supported way to keep it fast — disabling thinking on
          // Opus 5 can make it narrate tool calls or leak internal tags.
          output_config: {
            effort: 'low',
            // Schema-enforced output. The old prompt asked for "ONLY JSON" and
            // then regex-scraped the first {...}, which broke on any preamble.
            format: {
              type: 'json_schema',
              schema: CLOUD_ANSWER_SCHEMA
            }
          },
          // Opt in to server-side fallback so a policy decline is retried on
          // another model inside the same call rather than just failing.
          fallbacks: 'default',
          system: 'You help residents of Round Rock, Texas sort their waste correctly. Follow ONLY the Round Rock rules given to you.',
          messages: [{
            role: 'user',
            content: [
              { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64Data } },
              {
                type: 'text', text: rulesPrompt() +
                  '\nLook at the photo. Identify the single main object a person is trying to throw away.\n' +
                  'Judge the material from what you can see — a steel or insulated bottle is not the same as a single-use plastic one.\n' +
                  'Set match to an exact item name from the list above, or an empty string if none fits.\n' +
                  'Set confidence to how sure you are, from 0 to 1.'
              }
            ]
          }]
        })
      });
      if (!r.ok) {
        if (r.status === 401 || r.status === 403) { store.set('model', ''); throw new Error('KEY'); }
        if (r.status === 404) { store.set('model', ''); throw new Error('MODEL'); }
        if (r.status === 429) throw new Error('BUSY');
        throw new Error((await r.text()).slice(0, 160));
      }
      const data = await r.json();
      // A safety decline arrives as HTTP 200, so stop_reason has to be checked
      // before reading content.
      if (data.stop_reason === 'refusal') throw new Error('REFUSED');
      const txt = (data.content || []).filter(c => c.type === 'text').map(c => c.text || '').join('');
      if (!txt.trim()) throw new Error('PARSE');
      try {
        return JSON.parse(txt);
      } catch (e) {
        // Schema-enforced output should already be clean; this only covers a
        // model that ignored the format.
        const m = txt.match(/\{[\s\S]*\}/);
        if (!m) throw new Error('PARSE');
        return JSON.parse(m[0]);
      }
    }

    /* ---------- Image Processing & Camera View Logic ---------- */
    function shrinkImage(file) {
      return new Promise((res, rej) => {
        const img = new Image(), fr = new FileReader();
        fr.onload = () => img.src = fr.result;
        fr.onerror = rej;
        img.onload = () => {
          const max = 1100;
          let { width: w, height: h } = img;
          if (w > max || h > max) {
            const r = Math.min(max / w, max / h);
            w = Math.round(w * r);
            h = Math.round(h * r);
          }
          const cv = document.createElement('canvas');
          cv.width = w;
          cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          res({
            dataUrl: cv.toDataURL('image/jpeg', .82),
            canvas: cv,
            img: img,
            /* Text recognition needs far more detail than classification does:
               on a real bottle photo the brand was unreadable at 1100px, 1600px
               and 2200px, and only resolved at full size. Rendered on demand so
               the cost is paid only where native OCR exists. */
            ocrDataUrl() {
              const M = 3000;
              let ow = img.naturalWidth || img.width, oh = img.naturalHeight || img.height;
              if (ow > M || oh > M) {
                const r = Math.min(M / ow, M / oh);
                ow = Math.round(ow * r); oh = Math.round(oh * r);
              }
              const c = document.createElement('canvas');
              c.width = ow; c.height = oh;
              c.getContext('2d').drawImage(img, 0, 0, ow, oh);
              return c.toDataURL('image/jpeg', .92);
            }
          });
        };
        img.onerror = rej;
        fr.readAsDataURL(file);
      });
    }

    /* ================= learning from corrections =================
       The neural network is frozen — nothing here retrains it. What this does
       is remember the signals a scan produced (barcode, label text, predicted
       class) alongside the answer the user says is right, and prefer that
       answer next time the same signals show up. Corrections are also the
       labelled data an item-specific classifier would later be trained on. */

    const CORRECTION_STORE_KEY = 'corrections_v1';
    /** Below this the app asks instead of asserting. */
    const CONFIRM_BELOW = 0.60;

    /** Signals from the scan in progress, so a correction can be attributed. */
    let _lastScanSignals = null;
    /** The photo being handled, for cloud escalation. */
    let _lastScanDataUrl = null;

    function _normToken(v) { return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

    /** Signal keys for one scan, strongest identifier first. */
    function signalKeys(sig) {
      const keys = [];
      if (!sig) return keys;
      if (sig.barcode) keys.push(['bc:' + sig.barcode, 0.97]);
      (sig.textTokens || []).forEach(t => {
        const n = _normToken(t);
        if (n.length >= 4 && n.length <= 24) keys.push(['txt:' + n, 0.92]);
      });
      (sig.classes || []).forEach(c => {
        const n = String(c || '').toLowerCase().split(',')[0].trim();
        if (n) keys.push(['cls:' + n, 0.75]);
      });
      // The item model's top item (an ITEMS name), set only when it answered or
      // asked. sig.items holds chooser candidates and is never a key: a
      // not_waste scan has candidates but nothing to learn against. MobileNet
      // classes are empty when the item model ran, so without this nothing would
      // be learned.
      if (sig.itemKey) keys.push(['itm:' + sig.itemKey, 0.75]);
      return keys;
    }

    /* A broad key names a kind of thing, not this exact item: ImageNet's
       "water bottle" class, or the item model's top guess, covers a PET bottle
       and a steel flask alike. Corrections on broad keys are trusted only once
       taught twice, or when the pipeline is unsure anyway. */
    function isBroadKey(k) {
      return /^(cls|itm):/.test(k);
    }

    /* May a learned correction be asserted against this incoming result? A
       broad key must never move an answer out of hazardous waste, however many
       times it was taught: not when the incoming result is hhw and the learned
       item is not, and not when the item model asked because a hazardous item
       was a plausible runner-up (hazardItem). Specific keys (bc:, txt:) are
       this exact item and always may. */
    /* The ITEMS entry behind an incoming scan result, for the chooser. Results
       often carry a display name ("Battery item", "Battery / cylindrical
       item"), so try the exact name, then the ITEMS name the step matched
       (extra.match), then a search hit in the same bin (search() fuzzy-matches
       and honours the list's category filter), then any entry in the bin. A
       hazardous result always resolves to a hazardous entry. */
    function resolveIncomingItem(it, extra) {
      const match = extra && extra.match;
      const sameBinHit = () => {
        const hit = (search(it.n) || [])[0];
        return hit && hit.cat === it.cat ? hit : null;
      };
      const byCat = () => ITEMS.find(i => i.cat === it.cat) || null;
      const r = ITEMS.find(i => i.n === it.n)
        || (match ? ITEMS.find(i => i.n === match) : null)
        || sameBinHit() || byCat();
      return it.cat === 'hhw' && (!r || r.cat !== 'hhw') ? (byCat() || r) : r;
    }

    function learnedMayAssert(learned, incomingCat, hazardItem) {
      if (!learned || !learned.item) return false;
      if (!isBroadKey(learned.key)) return true;
      if (incomingCat === 'hhw' && learned.item.cat !== 'hhw') return false;
      return !hazardItem;
    }

    /* ---------- trained material classifier (iOS only) ----------
       A small Core ML model (WasteMaterial.mlmodel) that names a material, not
       an item. The first build was trained on TrashNet's six materials;
       ml/materials.json retrains it on the Garbage Dataset's ten classes
       (adding battery, food, clothes and shoes). WasteModels.MATERIAL_TO_ITEM
       maps each label to an ITEMS entry. A handful of materials instead of a
       thousand ImageNet classes is why it avoids the failure that mattered
       most: ImageNet calls an aluminium can "hair spray" at 67% and the app
       then routes a recyclable can to hazardous waste.

       It still only sees material, never the specific item, so it ranks below
       the barcode, the printed label, visual memory and the item model, and is
       capped to a suggestion whenever the item model ran. */
    function matchMaterialPrediction(materials) {
      if (typeof WasteModels === 'undefined') {
        if (!matchMaterialPrediction.warned) {
          matchMaterialPrediction.warned = true;
          console.warn('waste-models.js not loaded; material fallback disabled');
        }
        return null;
      }
      return WasteModels.interpretMaterials(materials, ITEMS);
    }

    /* ---------- visual memory ----------
       Apple's feature print is a 768-float embedding of the image. Storing one
       against each correction lets the app recognise the same physical object
       again from a fresh photo, which no amount of colour heuristics could do.
       Calibrated on real photos: the same bottle re-shot, re-cropped, rotated
       and resized scored 0.17-0.52, while genuinely different objects never
       came closer than 0.59. 0.45 keeps a clear margin — a false visual match
       would assert the wrong bin, so precision matters more than recall. */
    const VISUAL_MEMORY_KEY = 'visual_memory_v1';
    const VISUAL_MATCH_MAX_DISTANCE = 0.45;
    const VISUAL_MEMORY_LIMIT = 40;

    function _decodeFeaturePrint(b64) {
      try {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new Float32Array(bytes.buffer);
      } catch (e) { return null; }
    }

    /** Plain L2 — verified to match VNFeaturePrintObservation.computeDistance. */
    function _featureDistance(a, b) {
      if (!a || !b || a.length !== b.length) return Infinity;
      let sum = 0;
      for (let i = 0; i < a.length; i++) { const d = a[i] - b[i]; sum += d * d; }
      return Math.sqrt(sum);
    }

    const VisualMemory = {
      all() { const m = store.get(VISUAL_MEMORY_KEY, []); return Array.isArray(m) ? m : []; },
      size() { return this.all().length; },
      reset() { store.set(VISUAL_MEMORY_KEY, []); },

      remember(printB64, itemName) {
        if (!printB64 || !itemName) return false;
        const list = this.all().filter(e => !(e.item === itemName && e.print === printB64));
        list.unshift({ print: printB64, item: itemName, ts: Date.now() });
        store.set(VISUAL_MEMORY_KEY, list.slice(0, VISUAL_MEMORY_LIMIT));
        return true;
      },

      /** @returns {{item:object,distance:number}|null} nearest remembered item. */
      match(printB64) {
        const probe = _decodeFeaturePrint(printB64);
        if (!probe) return null;
        let best = null;
        for (const entry of this.all()) {
          const d = _featureDistance(probe, _decodeFeaturePrint(entry.print));
          if (d <= VISUAL_MATCH_MAX_DISTANCE && (!best || d < best.distance)) {
            const item = ITEMS.find(i => i.n === entry.item);
            if (item) best = { item, distance: d };
          }
        }
        return best;
      }
    };

    const Corrections = {
      all() { const m = store.get(CORRECTION_STORE_KEY, {}); return (m && typeof m === 'object') ? m : {}; },
      size() { return Object.keys(this.all()).length; },
      reset() { store.set(CORRECTION_STORE_KEY, {}); },
      exportJson() { return JSON.stringify(this.all(), null, 2); },

      record(sig, itemName) {
        // Remember what it looked like as well as what it was called.
        if (sig && sig.featureprint) VisualMemory.remember(sig.featureprint, itemName);
        const keys = signalKeys(sig);
        if (!itemName || !keys.length) return 0;
        const m = this.all();
        for (const [k] of keys) {
          const prev = m[k];
          m[k] = {
            item: itemName,
            hits: (prev && prev.item === itemName) ? (prev.hits || 1) + 1 : 1,
            ts: Date.now()
          };
        }
        store.set(CORRECTION_STORE_KEY, m);
        return keys.length;
      },

      /** @returns {{item:object,key:string,confidence:number,hits:number}|null} */
      lookup(sig, currentConfidence) {
        const m = this.all();
        for (const [k, baseConf] of signalKeys(sig)) {
          const hit = m[k];
          if (!hit || !hit.item) continue;
          // A broad key (an ImageNet class or the item model's guess) covers
          // more than one real item — "water bottle" is a PET bottle and a steel
          // flask alike — so only let it override once it has been taught twice,
          // or when the pipeline was unsure anyway.
          if (isBroadKey(k) && (hit.hits || 1) < 2 &&
              currentConfidence != null && currentConfidence >= 0.7) continue;
          const item = ITEMS.find(i => i.n === hit.item);
          if (item) {
            return {
              item, key: k, hits: hit.hits || 1,
              confidence: Math.min(0.97, baseConf + Math.min(0.04, ((hit.hits || 1) - 1) * 0.02))
            };
          }
        }
        return null;
      }
    };

    /** Plausible alternatives for the chooser, drawn from what was actually seen. */
    function buildCandidates(bestItem, sig, limit = 4) {
      const out = [];
      const push = it => {
        if (it && !out.some(x => x.n === it.n)) out.push(it);
      };
      push(bestItem);
      (sig && sig.items || []).forEach(n => push(ITEMS.find(i => i.n === n)));
      (sig && sig.classes || []).forEach(cls => {
        const c = String(cls || '').toLowerCase();
        for (const key in IMAGENET_TO_ROUND_ROCK) {
          if (classMatchesKeyLoose(key.toLowerCase(), c)) {
            const m = IMAGENET_TO_ROUND_ROCK[key];
            push(ITEMS.find(i => i.n.toLowerCase() === String(m.match).toLowerCase()));
            break;
          }
        }
        if (out.length < limit) push(search(c)[0]);
      });
      ['Water or soda bottle', 'Aluminum can', 'Cardboard box', 'Glass bottle (wine, beer, liquor)']
        .forEach(n => { if (out.length < limit) push(ITEMS.find(i => i.n === n)); });
      return out.slice(0, limit);
    }

    /* Same synonym comparison the matcher uses, hoisted so the chooser shares it. */
    function classMatchesKeyLoose(klow, cls) {
      const syn = v => v.toLowerCase().split(',').map(t => t.trim()).filter(Boolean);
      const keyTerms = syn(klow), clsTerms = syn(cls);
      return keyTerms.some(kt => clsTerms.some(ct => {
        if (ct === kt) return true;
        if (kt.length <= 6) return false;
        return new RegExp('\\b' + kt.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(ct);
      }));
    }

    /** Ask rather than assert. Also the screen used to correct a wrong answer. */
    function showItemChooser(opts) {
      const { title, lead, candidates, signals } = opts;
      let h = `<h1 class="large">${esc(title)}</h1><p class="lead">${esc(lead)}</p>`;
      if (candidates.length) {
        h += `<div class="list">` + candidates.map((it, i) => {
          const c = CATS[it.cat];
          return `<button class="row" data-pick="${i}">${gl(c.ico)}
          <span class="txt"><span class="t">${esc(it.n)}</span>
          <span class="s">${esc(c.short)}</span></span>${chev()}</button>`;
        }).join('') + `</div>`;
      }
      h += `<div class="actions pad" style="padding-top:20px">
        <button class="primary" data-go="search">${gl('search', 30, 1.6)}
          <span><span class="t">Search by name</span>
          <span class="s">None of these is right</span></span></button>
        <button class="secondary" data-go="scan">${gl('camera', 22, 1.8)} Try another photo</button>
      </div>`;
      $('#s-answer').innerHTML = h;
      $$('#s-answer [data-pick]').forEach(b => {
        b.onclick = () => {
          const it = candidates[+b.dataset.pick];
          const n = Corrections.record(signals, it.n);
          showAnswer(it, n ? {
            badge: 'Saved — I’ll remember this',
            badgeIcon: 'bolt',
            badgeSub: 'Next time this item looks the same, I’ll start here'
          } : null);
        };
      });
      go('answer');
    }

    /* ---------- cloud escalation ----------
       Cloud is a second opinion, not the first move. Every on-device tier runs
       first; the cloud is only consulted when the device is genuinely unsure,
       which keeps the common case free, private and instant, and spends a paid
       request only where it changes the answer. */
    function cloudEscalationAvailable() {
      const mode = store.get('ai_mode', 'local');
      if (mode !== 'auto' && mode !== 'cloud') return false;
      if (!store.get('key', '')) return false;
      return getCameraScanUsage() < store.get('max_daily_scans', CAMERA_DAILY_LIMIT);
    }

    /** @returns {Promise<object|null>} an answer, or null if the cloud could not help. */
    async function escalateToCloud(dataUrl) {
      const key = store.get('key', '');
      if (!key || !dataUrl) return null;
      try {
        setAiScanProgress('Not sure — asking the cloud model…', 80, 'Second opinion');
        const isGemini = key.startsWith('AIza') || store.get('cloud_provider', 'gemini') === 'gemini';
        const base64Data = dataUrl.split(',')[1];
        const out = isGemini ? await callGeminiVision(key, base64Data)
                             : await callClaudeVision(key, base64Data);
        incrementCameraScanUsage();
        return out;
      } catch (e) {
        console.warn('Cloud escalation failed, staying on-device:', e && e.message);
        return null;
      }
    }

    /** Turn a cloud response into the same shape the on-device tiers produce. */
    function cloudAnswerToResult(out, isGemini) {
      let item = ITEMS.find(i => i.n.toLowerCase() === String(out.match || '').toLowerCase());
      if (!item && out.match) item = search(out.match)[0];
      if (!item && out.item) item = search(out.item)[0];
      const conf = Number(out.confidence);
      return {
        it: {
          n: out.item || (item ? item.n : 'This item'),
          cat: CATS[out.category] ? out.category : (item ? item.cat : 'trash'),
          note: item && item.note ? item.note : (out.tip || '')
        },
        extra: {
          why: out.why,
          confidence: isNaN(conf) ? 0.8 : conf,
          badge: 'Cloud AI second opinion',
          badgeIcon: 'sparkle',
          badgeSub: isGemini ? 'Google Gemini' : 'Anthropic Claude'
        }
      };
    }

    /**
     * Single exit point for every scan result: applies anything already learned,
     * then either answers or asks.
     */
    async function deliverScanResult(it, extra) {
      const sig = _lastScanSignals;
      const conf = extra && extra.confidence != null ? Number(extra.confidence) : null;

      // Recognising the same physical object again is the strongest evidence
      // short of a barcode: it is this exact item, not merely something that
      // looks similar in colour.
      const seen = sig && sig.featureprint ? VisualMemory.match(sig.featureprint) : null;
      if (seen && !(sig && sig.barcode)) {
        return showAnswer(seen.item, {
          why: 'I recognise this as the same item you corrected me on before.',
          confidence: Math.max(0.85, 0.97 - seen.distance / 2),
          badge: 'Recognised from a photo you corrected',
          badgeIcon: 'bolt',
          badgeSub: `Visual match, distance ${seen.distance.toFixed(2)}`,
          fixable: true,
          signals: sig
        });
      }

      const learned = Corrections.lookup(sig, conf);

      // A broad key must not move this result out of hazardous waste, however
      // often it was taught: ask, listing what was learned, what the pipeline
      // saw and the hazardous item.
      const hazardItem = extra && extra.hazardItem ? extra.hazardItem : null;
      if (learned && !learnedMayAssert(learned, it.cat, extra && extra.hazardItem)) {
        const incoming = resolveIncomingItem(it, extra);
        const cands = [];
        [learned.item, incoming, hazardItem].concat(buildCandidates(learned.item, sig))
          .forEach(c => { if (c && cands.length < 4 && !cands.some(x => x.n === c.n)) cands.push(c); });
        return showItemChooser({
          title: 'Is this the same one again?',
          lead: `Last time something like this turned out to be a ${learned.item.n}. Is that right?`,
          candidates: cands,
          signals: sig
        });
      }

      // A correction matched only on a broad key (cls: or itm:) is weak evidence: the
      // ImageNet class "water bottle" covers a disposable PET bottle and a steel
      // flask alike, so teaching one must not silently relabel the other. When
      // the pipeline was also unsure, offer it as the leading suggestion instead
      // of asserting it.
      // Once the same correction has been confirmed twice, stop asking and just
      // use it — otherwise the app would re-ask the same question forever.
      if (learned && isBroadKey(learned.key) && learned.hits < 2 &&
          conf != null && conf < CONFIRM_BELOW) {
        return showItemChooser({
          title: 'Is this the same one again?',
          lead: `Last time something like this turned out to be a ${learned.item.n}. Is that right?`,
          candidates: buildCandidates(learned.item, sig),
          signals: sig
        });
      }

      if (learned) {
        return showAnswer(learned.item, {
          why: 'You corrected this before, so I am using what you taught me.',
          confidence: learned.confidence,
          badge: `From your correction${learned.hits > 1 ? ` (seen ${learned.hits}×)` : ''}`,
          badgeIcon: 'bolt',
          badgeSub: 'Stored on this device only',
          fixable: true,
          signals: sig
        });
      }

      if (conf != null && conf < CONFIRM_BELOW) {
        // Ask the cloud before asking the user.
        if (cloudEscalationAvailable() && _lastScanDataUrl) {
          const out = await escalateToCloud(_lastScanDataUrl);
          if (out) {
            const key = store.get('key', '');
            const isGemini = key.startsWith('AIza') || store.get('cloud_provider', 'gemini') === 'gemini';
            const mapped = cloudAnswerToResult(out, isGemini);
            if (!(mapped.extra.confidence < CONFIRM_BELOW)) {
              return showAnswer(mapped.it, Object.assign({}, mapped.extra,
                { fixable: true, signals: sig }));
            }
            // Cloud was unsure too — fall through and ask.
          }
        }
        const best = ITEMS.find(i => i.n === it.n) ||
                     ITEMS.find(i => i.cat === it.cat) || ITEMS[0];
        return showItemChooser({
          title: 'Which one is it?',
          lead: `I think this is a ${it.n}, but I am only ${Math.round(conf * 100)}% sure. Pick the right one and I will remember it.`,
          candidates: buildCandidates(best, sig),
          signals: sig
        });
      }

      return showAnswer(it, Object.assign({}, extra, { fixable: true, signals: sig }));
    }

    /* What the item model contributes to _lastScanSignals: its guesses for the
       chooser (whatever the verdict, even none) and the correction key, which
       is the top item only when it answered or asked. */
    function itemModelSignals(predictions, v) {
      return {
        items: WasteModels.itemCandidates(predictions, ITEMS).map(i => i.n),
        itemKey: v && (v.kind === 'answer' || v.kind === 'ask') ? v.item.n : null
      };
    }

    async function handlePhoto(file) {
      if (!file) return;

      const mode = store.get('ai_mode', 'local');
      const key = store.get('key', '');

      // Cost & rate protection only enforced when user chooses custom Cloud AI
      if (mode === 'cloud') {
        const maxScans = store.get('max_daily_scans', CAMERA_DAILY_LIMIT);
        const usedScans = getCameraScanUsage();
        if (usedScans >= maxScans) {
          return apiError(`Daily cloud camera limit reached (${usedScans}/${maxScans}). You can switch to free On-Device AI in Settings anytime!`);
        }
      }

      let processed;
      try {
        processed = await shrinkImage(file);
      } catch (e) {
        return apiError('That photo couldn’t be read. Please try again.');
      }

      const { dataUrl, canvas, img, ocrDataUrl } = processed;
      $('#preview').src = dataUrl;
      $('#busy').style.display = 'block';
      $$('#s-scan > *').forEach(el => { if (el.id !== 'busy') el.style.display = 'none'; });

      setAiScanProgress('Scanning barcode and packaging logos…', 25, 'Stage 1 of 4');

      // Step 0: one native Vision pass (iOS app only) covering barcode, text
      // and classification at once. Everything downstream reads the cache, and
      // every step still works when this returns null.
      _lastScanSignals = { barcode: null, textTokens: [], classes: [], featureprint: null, items: [], itemKey: null };
      // Kept so a low-confidence result can be escalated to the cloud without
      // re-encoding the photo.
      _lastScanDataUrl = dataUrl;

      _nativeVisionForCurrentPhoto = null;
      if (NativeVision.available) {
        // Full detail here: barcodes and label text are small in a normal photo.
        let visionSrc = dataUrl;
        try { visionSrc = ocrDataUrl(); } catch (e) { console.warn('hi-res render notice:', e); }
        _nativeVisionForCurrentPhoto = await NativeVision.analyze(visionSrc);
        if (_nativeVisionForCurrentPhoto) {
          _lastScanSignals.featureprint =
            (_nativeVisionForCurrentPhoto.featureprint || {}).data || null;
          _lastScanSignals.textTokens = _nativeVisionForCurrentPhoto.text
            .filter(t => t.confidence == null || t.confidence >= 0.3)
            .flatMap(t => String(t.value).split(/\s+/))
            .slice(0, 40);
          console.log('Native Vision:',
            _nativeVisionForCurrentPhoto.barcodes.length + ' barcode(s), ' +
            _nativeVisionForCurrentPhoto.text.length + ' text block(s), ' +
            _nativeVisionForCurrentPhoto.classes.length + ' class(es)');
        }
      }

      // Step 1: Check for Barcode / Packaging lookup
      try {
        const barcode = await detectBarcodeFromImage(canvas);
        if (barcode) {
          _lastScanSignals.barcode = barcode;
          setAiScanProgress(`Found barcode ${barcode} — looking up product packaging…`, 45, 'Stage 1 of 4');
          const product = await lookupProductBarcode(barcode);
          if (product) {
            const parsed = parsePackagingToRoundRock(product, barcode);
            let item = ITEMS.find(i => i.n.toLowerCase() === String(parsed.match || '').toLowerCase()) || search(parsed.match)[0];
            await deliverScanResult({
              n: parsed.item || (item ? item.n : 'Packaged item'),
              cat: CATS[parsed.cat] ? parsed.cat : (item ? item.cat : 'recycle'),
              note: item && item.note ? item.note : (parsed.tip || '')
            }, {
              why: parsed.why,
              confidence: parsed.confidence,
              badge: parsed.badge,
              badgeIcon: parsed.badgeIcon,
              badgeSub: `UPC/EAN: ${barcode}`
            });
            return;
          }
        }
      } catch (err) {
        console.warn('Barcode step passed to vision model:', err);
      }

      // Step 1.5: what does the packaging say? A printed resin code, a
      // How2Recycle instruction or a brand name is far more reliable than
      // inferring material from pixels, so it outranks the neural classifier.
      if (_nativeVisionForCurrentPhoto && _nativeVisionForCurrentPhoto.text.length) {
        setAiScanProgress('Reading labels and recycling codes…', 40, 'Stage 2 of 4');
        try {
          const label = readPackagingText(_nativeVisionForCurrentPhoto.text);
          if (label) {
            const item = ITEMS.find(i => i.n.toLowerCase() === String(label.match || '').toLowerCase())
              || search(label.match)[0];
            await deliverScanResult({
              n: label.item || (item ? item.n : 'Packaged item'),
              cat: CATS[label.cat] ? label.cat : (item ? item.cat : 'trash'),
              note: item && item.note ? item.note : (label.tip || '')
            }, {
              why: label.why,
              confidence: label.confidence,
              badge: label.badge,
              badgeIcon: label.badgeIcon,
              badgeSub: 'On-device text recognition'
            });
            return;
          }
        } catch (e) {
          console.warn('Label reading notice:', e);
        }
      }

      // Step 2: Cloud AI Mode (if explicitly configured & selected by user)
      if (mode === 'cloud' && key) {
        setAiScanProgress('Analyzing image with Cloud AI…', 60, 'Cloud Stage 2');
        try {
          const isGemini = key.startsWith('AIza') || store.get('cloud_provider', 'gemini') === 'gemini';
          const base64Data = dataUrl.split(',')[1];
          const out = isGemini ? await callGeminiVision(key, base64Data) : await callClaudeVision(key, base64Data);

          incrementCameraScanUsage();

          let item = ITEMS.find(i => i.n.toLowerCase() === String(out.match || '').toLowerCase());
          if (!item && out.match) item = search(out.match)[0];
          if (!item && out.item) item = search(out.item)[0];
          await deliverScanResult({
            n: out.item || (item ? item.n : 'This item'),
            cat: CATS[out.category] ? out.category : (item ? item.cat : 'trash'),
            note: item && item.note ? item.note : (out.tip || '')
          }, {
            why: out.why,
            confidence: Number(out.confidence),
            badge: 'Cloud AI Analysis',
            badgeIcon: 'sparkle',
            badgeSub: isGemini ? 'Google Gemini 2.0 Flash' : 'Anthropic Claude'
          });
          return;
        } catch (e) {
          console.warn('Cloud AI error, falling back to on-device engine:', e);
          // Fall back gracefully to on-device if cloud fails
        }
      }

      // Step 2.5: the on-device item model (iOS only). It names the specific
      // item, so it leads visual recognition; MobileNet below is capped to a
      // suggestion whenever this ran. No-op in the browser and on Android.
      const itemModelRan = typeof WasteModels !== 'undefined'
        && WasteModels.itemModelRan(_nativeVisionForCurrentPhoto);
      if (itemModelRan) {
        const v = WasteModels.interpretItems(_nativeVisionForCurrentPhoto.items, ITEMS,
          { confirmBelow: CONFIRM_BELOW });
        Object.assign(_lastScanSignals, itemModelSignals(_nativeVisionForCurrentPhoto.items, v));
        if (v && v.kind === 'not_waste') {
          // What the user taught the app outranks the model's "nothing here":
          // hand a learned object to deliverScanResult, which re-checks visual
          // memory and corrections first and shows its own badge. The not_waste
          // confidence is the pipeline's confidence here, so a once-taught broad
          // key (itm:/cls:) does not override a confident "nothing here", and
          // below CONFIRM_BELOW it is asked about rather than asserted.
          const sig = _lastScanSignals;
          const learnedHit = (sig.featureprint && !sig.barcode && VisualMemory.match(sig.featureprint))
            || Corrections.lookup(sig, v.confidence);
          if (learnedHit) {
            await deliverScanResult({ n: learnedHit.item.n, cat: learnedHit.item.cat, note: learnedHit.item.note || '' },
              { confidence: v.confidence });
            return;
          }
          showItemChooser({
            title: 'Nothing to sort here?',
            lead: 'I could not spot one item to throw away in that photo. Fill the frame with just that item and try again, or pick it below.',
            candidates: buildCandidates(null, _lastScanSignals),
            signals: _lastScanSignals
          });
          return;
        }
        if (v && (v.kind === 'answer' || v.kind === 'ask')) {
          await deliverScanResult({ n: v.item.n, cat: v.item.cat, note: v.item.note || '' }, {
            why: v.why,
            confidence: v.confidence,
            badge: v.badge,
            badgeIcon: v.item.cat === 'recycle' ? 'recycle' : 'bolt',
            badgeSub: 'On-device item model',
            hazardItem: v.hazard
          });
          return;
        }
      }

      // Step 3: On-Device Vision Neural Network with Multi-Scale Pyramidal Inspection
      setAiScanProgress('Analyzing Amazon Prime branding & material signatures…', 50, 'Stage 2 of 4');

      try {
        const model = await loadMobileNetModel();
        // Not gated on `model`: the material/colour heuristics below are pure
        // canvas maths and must still run when the model fails to load.
        {
          // Helper to extract sub-canvas (scale or bounding box spec)
          function getCropCanvas(srcCanvas, spec) {
            if (typeof spec === 'number') {
              if (spec >= 1.0) return srcCanvas;
              const cw = Math.round(srcCanvas.width * spec);
              const ch = Math.round(srcCanvas.height * spec);
              const sx = Math.round((srcCanvas.width - cw) / 2);
              const sy = Math.round((srcCanvas.height - ch) / 2);
              const c = document.createElement('canvas');
              c.width = Math.max(1, cw);
              c.height = Math.max(1, ch);
              const ctx = c.getContext('2d');
              ctx.drawImage(srcCanvas, sx, sy, cw, ch, 0, 0, c.width, c.height);
              return c;
            } else if (spec && typeof spec === 'object') {
              const sx = Math.round(srcCanvas.width * spec.x);
              const sy = Math.round(srcCanvas.height * spec.y);
              const cw = Math.round(srcCanvas.width * spec.w);
              const ch = Math.round(srcCanvas.height * spec.h);
              const c = document.createElement('canvas');
              c.width = Math.max(1, cw);
              c.height = Math.max(1, ch);
              const ctx = c.getContext('2d');
              ctx.drawImage(srcCanvas, sx, sy, cw, ch, 0, 0, c.width, c.height);
              return c;
            }
            return srcCanvas;
          }

          setAiScanProgress('Running on-device neural vision classifier…', 75, 'Stage 3 of 4');

          // 1) Full frame (100%)
          // 2) Wide center zoom (65%)
          // 3) Left flank crop (focuses on left face & label, avoiding central tape)
          // 4) Right flank crop (focuses on right face, avoiding central tape)
          // 5) Macro center (30% - for bottle caps, labels, small cans)
          const cropSpecs = [
            1.0,
            0.65,
            { x: 0.04, y: 0.10, w: 0.50, h: 0.80 },
            { x: 0.46, y: 0.10, w: 0.50, h: 0.80 },
            0.30
          ];
          let allPreds = [];

          if (model) {
            for (const spec of cropSpecs) {
              const cropCvs = getCropCanvas(canvas, spec);
              try {
                const preds = await model.classify(cropCvs, 6);
                preds.forEach(p => { p.spec = spec; });
                allPreds.push(...preds);
              } catch (ce) {}
            }
          }

          _lastScanSignals.classes = allPreds
            .filter(p => p.probability >= 0.10)
            .sort((a, b) => b.probability - a.probability)
            .map(p => p.className)
            .filter((v, i, arr) => arr.indexOf(v) === i)
            .slice(0, 6);

          // Compute material color & texture heuristics
          const materialSigs = analyzeImageMaterialSignatures(canvas);

          setAiScanProgress('Matching Round Rock recycling guidelines…', 95, 'Stage 4 of 4');

          // Also check for barcodes in the center crop (in case photo was taken from a distance)
          try {
            const zoomCvs = getCropCanvas(canvas, 0.45);
            const zoomBarcode = await detectBarcodeFromImage(zoomCvs);
            if (zoomBarcode) {
              const prod = await lookupProductBarcode(zoomBarcode);
              if (prod) {
                const parsed = parsePackagingToRoundRock(prod, zoomBarcode);
                let item = ITEMS.find(i => i.n.toLowerCase() === String(parsed.match || '').toLowerCase()) || search(parsed.match)[0];
                await deliverScanResult({
                  n: parsed.item || (item ? item.n : 'Packaged item'),
                  cat: CATS[parsed.cat] ? parsed.cat : (item ? item.cat : 'recycle'),
                  note: item && item.note ? item.note : (parsed.tip || '')
                }, {
                  why: parsed.why,
                  confidence: parsed.confidence,
                  badge: parsed.badge,
                  badgeIcon: parsed.badgeIcon,
                  badgeSub: `UPC/EAN: ${zoomBarcode}`
                });
                return;
              }
            }
          } catch (be) {}

          const matched = matchOnDevicePrediction(allPreds, materialSigs);
          if (matched) {
            let item = ITEMS.find(i => i.n.toLowerCase() === String(matched.match || '').toLowerCase()) || search(matched.match)[0];
            await deliverScanResult({
              n: matched.item || (item ? item.n : 'This item'),
              cat: CATS[matched.cat] ? matched.cat : (item ? item.cat : 'recycle'),
              note: item && item.note ? item.note : (matched.tip || '')
            }, {
              why: matched.why,
              confidence: itemModelRan ? Math.min(matched.confidence, CONFIRM_BELOW - 0.01) : matched.confidence,
              match: item ? item.n : matched.match,
              badge: matched.badge,
              badgeIcon: matched.badgeIcon,
              badgeSub: 'Multi-scale spatial vision analysis'
            });
            return;
          }
        }
      } catch (e) {
        console.warn('On-device inference exception:', e);
      }

      // Fallback if visual inference was ambiguous: show smart disambiguation selector
      // Trained material classifier, before giving up entirely.
      try {
        const mat = matchMaterialPrediction(
          _nativeVisionForCurrentPhoto && _nativeVisionForCurrentPhoto.materials);
        if (mat) {
          const item = ITEMS.find(i => i.n === mat.match);
          await deliverScanResult({
            n: mat.item, cat: mat.cat, note: item && item.note ? item.note : ''
          }, {
            why: mat.why,
            // Like MobileNet: only a suggestion when the item model ran.
            confidence: itemModelRan ? Math.min(mat.confidence, CONFIRM_BELOW - 0.01) : mat.confidence,
            badge: mat.badge, badgeIcon: mat.badgeIcon,
            match: mat.match,
            badgeSub: 'On-device material model'
          });
          return;
        }
      } catch (e) { console.warn('Material model notice:', e); }

      // Nothing identified on-device. Try the cloud, then ask.
      if (cloudEscalationAvailable() && _lastScanDataUrl) {
        const out = await escalateToCloud(_lastScanDataUrl);
        if (out) {
          const ckey = store.get('key', '');
          const isGemini = ckey.startsWith('AIza') || store.get('cloud_provider', 'gemini') === 'gemini';
          const mapped = cloudAnswerToResult(out, isGemini);
          await deliverScanResult(mapped.it, mapped.extra);
          return;
        }
      }

      // Nothing identified. Ask, and keep whatever the user says.
      showItemChooser({
        title: 'What did you scan?',
        lead: 'I could not identify that one. Tell me what it is and I will remember it for next time.',
        candidates: buildCandidates(null, _lastScanSignals),
        signals: _lastScanSignals
      });
    }

    /* ================= schedule ================= */
    const DAYNAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const fromIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

    function nthDow(year, month, dow, n) {
      const d = new Date(year, month, 1);
      let c = 0;
      for (; ;) { if (d.getDay() === dow) { if (++c === n) return new Date(d); } d.setDate(d.getDate() + 1); }
    }
    function holidaysAround(year) {
      return [nthDow(year, 10, 4, 4), new Date(year, 11, 25), new Date(year, 0, 1)];
    }
    /** The city slides collection one day for the rest of the week after these holidays. */
    function applyHoliday(base) {
      let hols = [];
      [base.getFullYear() - 1, base.getFullYear(), base.getFullYear() + 1].forEach(y => hols = hols.concat(holidaysAround(y)));
      const ws = new Date(base); ws.setDate(base.getDate() - base.getDay());
      const we = new Date(ws); we.setDate(ws.getDate() + 6);
      for (const h of hols) {
        if (h.getDay() === 0 || h.getDay() === 6) continue;   // weekend holidays don't shift collection
        if (h >= ws && h <= we && base >= h) {
          const d = new Date(base); d.setDate(d.getDate() + 1);
          return { date: d, delayed: true };
        }
      }
      return { date: base, delayed: false };
    }
    function upcoming(n) {
      const gday = store.get('gday', null), anchor = store.get('anchor', null);
      if (gday === null) return [];
      const out = [], today = new Date();
      today.setHours(0, 0, 0, 0);
      const d = new Date(today);
      d.setDate(d.getDate() - 8);
      while (d.getDay() !== gday) d.setDate(d.getDate() + 1);
      let guard = 0;
      while (out.length < n && guard++ < 200) {
        const s = applyHoliday(new Date(d));
        if (s.date >= today) {
          const rec = anchor ? Math.abs(Math.round((d - fromIso(anchor)) / 864e5)) % 14 === 0 : false;
          out.push({ base: new Date(d), date: s.date, delayed: s.delayed, recycling: rec });
        }
        d.setDate(d.getDate() + 7);
      }
      return out;
    }
    function friendlyDate(d) {
      const t = new Date(); t.setHours(0, 0, 0, 0);
      const diff = Math.round((d - t) / 864e5);
      if (diff === 0) return 'Today';
      if (diff === 1) return 'Tomorrow';
      return DAYNAMES[d.getDay()] + ', ' + d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
    }

    const pad = n => String(n).padStart(2, '0');
    const icsStamp = (d, hh, mm) => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(hh) + pad(mm) + '00';

    function makeIcs() {
      const list = upcoming(3);
      if (!list.length) return;
      const firstTrash = new Date(list[0].base); firstTrash.setDate(firstTrash.getDate() - 1);
      const firstRec = list.find(x => x.recycling);
      const recDay = firstRec ? new Date(firstRec.base) : null;
      if (recDay) recDay.setDate(recDay.getDate() - 1);
      const DOW = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][firstTrash.getDay()];

      // RFC 5545: escape TEXT values, then fold lines at 75 octets.
      const tx = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
      const enc = new TextEncoder();
      const fold = line => {
        if (enc.encode(line).length <= 74) return line;
        const out = []; let cur = '', len = 0;
        for (const ch of line) {
          const b = enc.encode(ch).length;
          if (len + b > (out.length ? 73 : 74)) { out.push(cur); cur = ''; len = 0; }
          cur += ch; len += b;
        }
        if (cur) out.push(cur);
        return out[0] + out.slice(1).map(s => '\r\n ' + s).join('');
      };

      const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Round Rock Waste Wizard//EN', 'CALSCALE:GREGORIAN'];
      const ev = (uid, start, rrule, title, desc) => ics.push(
        'BEGIN:VEVENT', 'UID:' + uid, 'DTSTAMP:' + icsStamp(new Date(), 12, 0),
        'DTSTART:' + icsStamp(start, 18, 0), 'DTEND:' + icsStamp(start, 18, 15),
        'RRULE:' + rrule, fold('SUMMARY:' + tx(title)), fold('DESCRIPTION:' + tx(desc)),
        'BEGIN:VALARM', 'TRIGGER:PT0S', 'ACTION:DISPLAY', fold('DESCRIPTION:' + tx(title)), 'END:VALARM', 'END:VEVENT');

      ev('rrw-trash-' + Date.now(), firstTrash, 'FREQ=WEEKLY;BYDAY=' + DOW,
        'Put out the trash cart', 'Round Rock: cart at the curb before 7 AM. Lid closed, wheels to the curb.');
      if (recDay) ev('rrw-rec-' + Date.now(), recDay, 'FREQ=WEEKLY;INTERVAL=2;BYDAY=' + DOW,
        'Recycling cart too (plus trash)', 'Round Rock: everything loose in the cart. No plastic bags. Rinse containers and flatten boxes.');
      ics.push('END:VCALENDAR');

      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([ics.join('\r\n')], { type: 'text/calendar' }));
      a.download = 'round-rock-pickup-reminders.ics';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Reminder file saved. Open it to add the events to your calendar.');
    }

      </details>
    </div>

    <p class="sec">Cloud API Cost &amp; Quota Protection</p>
    <div class="list">
      <div class="row">
        ${gl('shield')}
        <span class="txt">
          <span class="t">Daily Camera Quota</span>
          <span class="s">Limits camera scans to prevent unexpected API key charges</span>
        </span>
        <span class="val" style="font-weight:700">${getCameraScanUsage()} / ${store.get('max_daily_scans', CAMERA_DAILY_LIMIT)}</span>
      </div>
    </div>
    <div class="actions pad" style="padding-top:8px">
      <button class="secondary" id="resetScanLimit">${gl('check', 20, 2)} Reset today's camera usage</button>
    </div>
    ` : ''}

    <p class="sec">What I’ve learned from you</p>
    <div class="list">
      <div class="row">
        ${gl('bolt')}
        <span class="txt">
          <span class="t">Saved corrections</span>
          <span class="s">When you fix an answer I remember it, on this device only</span>
        </span>
        <span class="val" style="font-weight:700">${Corrections.size()}</span>
      </div>
      <div class="row">
        ${gl('camera')}
        <span class="txt">
          <span class="t">Items I recognise by sight</span>
          <span class="s">Photos you corrected, stored as a maths fingerprint — not the picture</span>
        </span>
        <span class="val" style="font-weight:700">${VisualMemory.size()}</span>
      </div>
    </div>
    ${(Corrections.size() || VisualMemory.size()) ? `<div class="actions pad" style="padding-top:8px">
      <button class="tertiary warn" id="forgetCorrections">Forget what I’ve learned</button>
    </div>` : ''}

    <p class="sec">Pickup</p>
    <div class="list">
      <button class="row" data-go="schedule">${gl('calendar')}
        <span class="txt"><span class="t">Pickup</span>
        <span class="s">Your collection days and reminders</span></span>
        <span class="val">${store.get('gday', null) === null ? 'Not set' : DAYNAMES[store.get('gday', 1)]}</span>${chev()}</button>
    </div>

    <p class="sec">Install</p>
    <div class="block"><h3>Add to home screen</h3>
      <p class="dim">iPhone: tap Share, then “Add to Home Screen.”
Android: tap the ⋮ menu, then “Add to Home screen.”</p></div>

    <p class="sec">Where these rules come from</p>
    <div class="list">${SOURCES.map(x =>
        `<a class="row" href="${x[1]}" target="_blank" rel="noopener">${gl('doc')}
        <span class="txt"><span class="t" style="color:var(--accent)">${esc(x[0])}</span></span>${chev()}</a>`).join('')}</div>
    <p class="foot" style="padding-bottom:24px">Every rule comes from the City of Round Rock’s published pages.
      Rules change — when in doubt, call <a href="tel:5122185554">512-218-5554</a>.
      This is an unofficial community app, not made by the City of Round Rock.</p>`;

      $('#bigBtn').onclick = () => {
        const v = !store.get('big', false);
        store.set('big', v); applyBig(); renderSettings();
        toast(v ? 'Larger text is on.' : 'Larger text is off.');
      };

      $('#modeLocalRow').onclick = () => {
        store.set('ai_mode', 'local');
        renderSettings();
        toast('On-Device & Barcode AI is active.');
      };

      $('#modeAutoRow').onclick = () => {
        store.set('ai_mode', 'auto');
        renderSettings();
        toast(store.get('key', '')
          ? 'On-device first, cloud only when unsure.'
          : 'Add an API key below to enable the cloud fallback.');
      };

      $('#modeCloudRow').onclick = () => {
        store.set('ai_mode', 'cloud');
        renderSettings();
        toast('Cloud AI Mode is active.');
      };

      const pSel = $('#providerSel');
      if (pSel) {
        pSel.onchange = () => {
          store.set('cloud_provider', pSel.value);
          renderSettings();
        };
      }

      const saveBtn = $('#saveKey');
      if (saveBtn) {
        saveBtn.onclick = () => {
          const v = $('#keyIn').value.trim();
          store.set('key', v);
          store.set('model', '');
          renderSettings();
          toast(v ? 'API key saved.' : 'Key removed.');
        };
      }

      const ck = $('#clearKey');
      if (ck) {
        ck.onclick = () => {
          const prev = store.get('key', '');
          store.set('key', ''); store.set('model', ''); renderSettings();
          toast('Key removed.', () => { store.set('key', prev); renderSettings(); toast('Key restored.'); });
        };
      }

      const forget = $('#forgetCorrections');
      if (forget) {
        forget.onclick = () => {
          Corrections.reset();
          VisualMemory.reset();
          toast('Forgot all saved corrections.');
          renderSettings();
        };
      }

      const rsl = $('#resetScanLimit');
      if (rsl) {
        rsl.onclick = () => {
          store.set('scan_limit_count', 0);
          renderSettings();
          toast('Today’s camera scan usage reset to 0.');
        };
      }
    }
    function applyBig() {
      document.documentElement.style.setProperty('--scale', store.get('big', false) ? '1.16' : '1');
    }

    /* ================= start ================= */
    applyBig();
    renderHome();
    renderFilters();
    renderResults();

  </script>
</body>

</html>
